name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
            ext: .exe
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.x'

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/almari-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" main.go

      - name: Package artifact (unix)
        if: matrix.os != 'windows'
        run: |
          cd dist
          tar -czf "almari-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "almari-${{ matrix.os }}-${{ matrix.arch }}"

      - name: Package artifact (windows)
        if: matrix.os == 'windows'
        run: |
          cd dist
          zip -X "almari-windows-${{ matrix.arch }}.zip" "almari-windows-${{ matrix.arch }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: almari-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/almari-${{ matrix.os }}-${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
